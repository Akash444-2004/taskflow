spring:
  application:
    name: taskflow-api
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 32
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    issuer: ${JWT_ISSUER:taskflow-api}
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
  cookies:
    secure: ${COOKIE_SECURE:false}
    refresh-name: ${REFRESH_COOKIE_NAME:taskflow_refresh}
    refresh-path: ${REFRESH_COOKIE_PATH:/api/auth}
