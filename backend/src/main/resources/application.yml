spring:
  application:
    name: taskflow-api
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: taskflow-api
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      data-source-properties:
        ApplicationName: taskflow-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 32
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    global-per-minute: ${RATE_LIMIT_GLOBAL_PER_MINUTE:120}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}
    register-per-minute: ${RATE_LIMIT_REGISTER_PER_MINUTE:3}
    password-change-per-minute: ${RATE_LIMIT_PASSWORD_CHANGE_PER_MINUTE:5}
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:true}
  jwt:
    issuer: ${JWT_ISSUER:taskflow-api}
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
  cookies:
    secure: ${COOKIE_SECURE:false}
    refresh-name: ${REFRESH_COOKIE_NAME:taskflow_refresh}
    refresh-path: ${REFRESH_COOKIE_PATH:/api/auth}
