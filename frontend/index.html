<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow — a collaborative workspace for projects, tasks, and teams." />
    <meta name="theme-color" content="#f7f8fa" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TaskFlow — Collaborative Project Management</title>
    <script>
      (function () {
        try {
          var key = "taskflow-theme";
          var saved = localStorage.getItem(key);
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = saved === "dark" || (!saved && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", isDark ? "#111827" : "#f7f8fa");
        } catch (_) {
          // Theme persistence is optional; the system preference remains the fallback.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
